name: Build sideload IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Bootstrap dependencies
        run: |
          set -euo pipefail
          chmod +x scripts/bootstrap.sh
          scripts/bootstrap.sh

      - name: App icon
        run: |
          set -euo pipefail
          python3 scripts/make_icon.py
          test -s RakuLLM/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d RakuLLM.xcodeproj

      - name: Run unit tests
        run: |
          set -euo pipefail
          xcrun simctl list devices
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '.devices[] | map(select(.name | contains("iPhone"))) | .[0].udid // empty' | head -1)
          if [ -n "$DEVICE_ID" ]; then
            echo "Targeting available simulator UDID: $DEVICE_ID"
            xcrun simctl boot "$DEVICE_ID" || true
            DEST="id=$DEVICE_ID"
          else
            DEST="platform=iOS Simulator,name=iPhone 16"
          fi
          xcodebuild test \
            -project RakuLLM.xcodeproj \
            -scheme RakuLLMTests \
            -destination "$DEST" \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData"

      - name: Build Release IPA bundle
        run: |
          set -euo pipefail
          xcodebuild \
            -project RakuLLM.xcodeproj \
            -scheme RakuLLM \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Framework smoke check
        run: |
          set -euo pipefail
          APP=$(find "$GITHUB_WORKSPACE/DerivedData/Build/Products" -path '*iphoneos*' -name 'RakuLLM.app' | head -1)
          echo "Discovered app bundle: $APP"
          test -d "$APP"
          test -f "$APP/Frameworks/llama.framework/llama"
          echo "llama.framework exists inside app bundle."
          otool -L "$APP/RakuLLM" | grep '@rpath/llama.framework/llama'
          echo "otool verified @rpath linkage to llama.framework."
          otool -l "$APP/RakuLLM" | grep -A 4 'LC_BUILD_VERSION'
          echo "Smoke check passed."

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find "$GITHUB_WORKSPACE/DerivedData/Build/Products" -path '*iphoneos*' -name 'RakuLLM.app' | head -1)
          test -d "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          codesign --force --deep --sign - Payload/RakuLLM.app || true
          rm -f RakuLLM.ipa
          ditto -c -k --keepParent Payload RakuLLM.ipa
          test -s RakuLLM.ipa
          unzip -l RakuLLM.ipa | head -n 30
          unzip -l RakuLLM.ipa | grep 'Payload/RakuLLM.app'

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RakuLLM-unsigned-ipa
          path: RakuLLM.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest RakuLLM.ipa \
            --latest \
            --title "RakuLLM for iPhone" \
            --notes "$(cat <<'EOF'
          Download **RakuLLM.ipa** and sideload it.

          https://github.com/ddr-ai/RakuLLM/releases/download/ios-latest/RakuLLM.ipa

          Open the file in SideStore, AltStore, Sideloadly, or Feather and sign it with your Apple ID. The build is unsigned on purpose so those tools can apply your signature.

          The Actions artifact is the same IPA, but GitHub wraps that download in a zip. This release asset is the IPA itself.

          Bundle ID: `io.github.ddr-ai.rakullm`
          EOF
          )"
