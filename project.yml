name: RakuLLM
options:
  bundleIdPrefix: io.github.ddr-ai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SUPPORTS_MACCATALYST: NO
targets:
  RakuLLM:
    type: application
    platform: iOS
    sources:
      - path: RakuLLM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ddr-ai.rakullm
        PRODUCT_NAME: RakuLLM
        INFOPLIST_FILE: RakuLLM/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Vendor"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - framework: Vendor/llama.xcframework
        embed: true
        codeSign: false
  RakuLLMTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RakuLLMTests
    dependencies:
      - target: RakuLLM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ddr-ai.rakullm.tests
        PRODUCT_NAME: RakuLLMTests
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
schemes:
  RakuLLM:
    build:
      targets:
        RakuLLM: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RakuLLMTests
  RakuLLMTests:
    build:
      targets:
        RakuLLMTests: all
    test:
      config: Debug
      targets:
        - RakuLLMTests
